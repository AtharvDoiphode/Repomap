<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes dashAnim {
        to { stroke-dashoffset: -32; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .flow-line {
        stroke-dasharray: 6 5;
        animation: dashAnim 1.6s linear infinite;
      }
      .pulse-dot {
        animation: pulseGlow 2s ease-in-out infinite;
      }
    </style>

    <pattern id="dotGridPipe" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#27272a" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="260" fill="#09090b" rx="10" />
  <rect width="1200" height="260" fill="url(#dotGridPipe)" rx="10" />
  <rect width="1198" height="258" x="1" y="1" fill="none" stroke="#27272a" stroke-width="1.5" rx="9" />

  <!-- Header Title -->
  <g transform="translate(40, 36)">
    <circle cx="6" cy="6" r="3.5" fill="#10b981" class="pulse-dot" />
    <text x="18" y="10" fill="#10b981" class="font-mono" font-size="11" font-weight="600" letter-spacing="1">
      INGESTION PIPELINE // ZERO-RATE-LIMIT ARCHITECTURE
    </text>
    <text x="0" y="32" fill="#fafafa" class="font-sans" font-size="18" font-weight="600">
      How RepoMap Extracts Module Graphs Without Cloning Code
    </text>
  </g>

  <!-- ── 4 Pipeline Stages ──────────────────────────────────── -->
  <g transform="translate(40, 105)">
    <!-- Connecting Arrow Lines -->
    <path d="M 235 55 L 295 55" stroke="#3f3f46" stroke-width="2" class="flow-line" />
    <polygon points="297,55 291,51 291,59" fill="#10b981" />

    <path d="M 525 55 L 585 55" stroke="#3f3f46" stroke-width="2" class="flow-line" />
    <polygon points="587,55 581,51 581,59" fill="#10b981" />

    <path d="M 815 55 L 875 55" stroke="#3f3f46" stroke-width="2" class="flow-line" />
    <polygon points="877,55 871,51 871,59" fill="#10b981" />

    <!-- Step 1: Recursive Git Trees -->
    <g transform="translate(0, 0)">
      <rect width="235" height="110" rx="6" fill="#111113" stroke="#27272a" stroke-width="1.2" />
      <rect width="235" height="26" rx="6" fill="#18181b" />
      <rect width="235" height="1" y="26" fill="#27272a" />
      <text x="12" y="17" fill="#10b981" class="font-mono" font-size="10" font-weight="600">01 / DISCOVERY</text>
      <text x="12" y="48" fill="#f4f4f5" class="font-mono" font-size="12" font-weight="600">Git Trees API (1x)</text>
      <text x="12" y="68" fill="#a1a1aa" class="font-mono" font-size="10">Fetches 100% file tree</text>
      <text x="12" y="84" fill="#71717a" class="font-mono" font-size="9">Strips node_modules &amp; locks</text>
      <text x="12" y="98" fill="#10b981" class="font-mono" font-size="9">Saves 95% API calls</text>
    </g>

    <!-- Step 2: Parallel CDN Fetch -->
    <g transform="translate(290, 0)">
      <rect width="235" height="110" rx="6" fill="#111113" stroke="#27272a" stroke-width="1.2" />
      <rect width="235" height="26" rx="6" fill="#18181b" />
      <rect width="235" height="1" y="26" fill="#27272a" />
      <text x="12" y="17" fill="#10b981" class="font-mono" font-size="10" font-weight="600">02 / PARALLEL AST</text>
      <text x="12" y="48" fill="#f4f4f5" class="font-mono" font-size="12" font-weight="600">Raw CDN Streams</text>
      <text x="12" y="68" fill="#a1a1aa" class="font-mono" font-size="10">raw.githubusercontent.com</text>
      <text x="12" y="84" fill="#71717a" class="font-mono" font-size="9">ES/CJS/Py import extraction</text>
      <text x="12" y="98" fill="#38bdf8" class="font-mono" font-size="9">Bypasses REST rate limits</text>
    </g>

    <!-- Step 3: MongoDB 24h TTL -->
    <g transform="translate(580, 0)">
      <rect width="235" height="110" rx="6" fill="#111113" stroke="#27272a" stroke-width="1.2" />
      <rect width="235" height="26" rx="6" fill="#18181b" />
      <rect width="235" height="1" y="26" fill="#27272a" />
      <text x="12" y="17" fill="#10b981" class="font-mono" font-size="10" font-weight="600">03 / PERSISTENCE</text>
      <text x="12" y="48" fill="#f4f4f5" class="font-mono" font-size="12" font-weight="600">MongoDB 24h TTL</text>
      <text x="12" y="68" fill="#a1a1aa" class="font-mono" font-size="10">Deterministic cache layer</text>
      <text x="12" y="84" fill="#71717a" class="font-mono" font-size="9">Auto-purges stale records</text>
      <text x="12" y="98" fill="#10b981" class="font-mono" font-size="9">&lt; 30ms repeat scans</text>
    </g>

    <!-- Step 4: React Flow & Mermaid -->
    <g transform="translate(870, 0)">
      <rect width="250" height="110" rx="6" fill="#111113" stroke="#10b981" stroke-width="1.5" />
      <rect width="250" height="26" rx="6" fill="#18181b" />
      <rect width="250" height="1" y="26" fill="#27272a" />
      <text x="12" y="17" fill="#10b981" class="font-mono" font-size="10" font-weight="600">04 / VISUAL TELEMETRY</text>
      <text x="12" y="48" fill="#f4f4f5" class="font-mono" font-size="12" font-weight="600">Graph &amp; Viral Exports</text>
      <text x="12" y="68" fill="#a1a1aa" class="font-mono" font-size="10">Dagre hierarchical auto-layout</text>
      <text x="12" y="84" fill="#71717a" class="font-mono" font-size="9">Mermaid.js README code</text>
      <text x="12" y="98" fill="#10b981" class="font-mono" font-size="9">SVG vector + JSON downloads</text>
    </g>
  </g>
</svg>
